name: dadbod-chinook

services:
  chinook_assets:
    image: alpine:3.20.3
    command: ["/bin/sh", "/bootstrap/fetch-chinook.sh"]
    volumes:
      - chinook_assets:/assets
      - ./docker/bootstrap/fetch-chinook.sh:/bootstrap/fetch-chinook.sh:ro
    restart: "no"

  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_DB: Chinook
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in .env}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Chinook"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres_init:
    image: postgres:16.10
    depends_on:
      chinook_assets: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in .env}
      DADBOD_RO_PASSWORD: ${DADBOD_RO_PASSWORD:?set in .env}
    command: ["/bin/sh", "/bootstrap/postgres-init.sh"]
    volumes:
      - chinook_assets:/assets:ro
      - ./docker/bootstrap/postgres-init.sh:/bootstrap/postgres-init.sh:ro
    restart: "no"

  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mysql_init:
    image: mysql:8.4.6
    depends_on:
      chinook_assets: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      DADBOD_RO_PASSWORD: ${DADBOD_RO_PASSWORD:?set in .env}
    command: ["/bin/sh", "/bootstrap/mysql-init.sh"]
    volumes:
      - chinook_assets:/assets:ro
      - ./docker/bootstrap/mysql-init.sh:/bootstrap/mysql-init.sh:ro
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in .env}
    ports: ["127.0.0.1:11433:1433"]
    volumes: ["sqlserver_data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  sqlserver_init:
    # SQL Server 2022 CU18 already ships sqlcmd at /opt/mssql-tools18/bin.
    # Microsoft does not publish a standalone mssql-tools18 container image.
    image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
    platform: linux/amd64
    depends_on:
      chinook_assets: { condition: service_completed_successfully }
      sqlserver: { condition: service_healthy }
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?set in .env}
      DADBOD_RO_PASSWORD: ${DADBOD_RO_PASSWORD:?set in .env}
    command: ["/bin/sh", "/bootstrap/sqlserver-init.sh"]
    volumes:
      - chinook_assets:/assets:ro
      - ./docker/bootstrap/sqlserver-init.sh:/bootstrap/sqlserver-init.sh:ro
    restart: "no"

volumes:
  chinook_assets:
  postgres_data:
  mysql_data:
  sqlserver_data:
